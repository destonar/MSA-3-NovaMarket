services:
  backend:
    build:
      context: ./SampleApp
      dockerfile: ./SampleApp.Api/Dockerfile
    container_name: backend
    ports:
      - "8081:8080"

  logistics:
    build:
      context: ./SampleApp
      dockerfile: ./SampleApp.Api/Dockerfile
    container_name: logistics
    ports:
      - "8082:8080"

  nginx:
    image: nginx:alpine
    restart: on-failure
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "81:80"
    depends_on:
      - backend